<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Currently Reading</title>
<style>
  body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#222}
  .card{display:flex;align-items:center;width:620px;max-width:calc(100vw - 24px);min-height:124px;box-sizing:border-box;padding:18px 20px;border:1px solid #e5e5e5;border-radius:8px;background:#fff}
  .cover{width:54px;height:82px;object-fit:cover;border-radius:2px;box-shadow:0 2px 7px rgba(0,0,0,.16)}
  .divider{height:82px;width:1px;background:#ddd;margin:0 20px}
  .label{font-size:10px;letter-spacing:.08em;color:#777;margin-bottom:9px}
  .title{font-size:16px;line-height:1.3;font-weight:700}
  .author{font-size:12px;color:#666;margin-top:7px}
  .source{font-size:10px;color:#aaa;margin-top:17px}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="app" class="card"><span style="font-size:12px;color:#777">Currently reading…</span></div>
<script>
fetch('current-reading.json?t='+Date.now()).then(r=>r.json()).then(b=>{
  const app=document.getElementById('app');
  if(!b.title){app.innerHTML='<span style="font-size:12px;color:#777">Not currently reading</span>';return;}
  app.innerHTML=`<img class="cover" src="${b.cover}" alt="Book cover"><div class="divider"></div><div><div class="label">CURRENTLY READING</div><div class="title"><a href="${b.url}">${escapeHtml(b.title)}</a></div><div class="author">by ${escapeHtml(b.author)}</div><div class="source">Goodreads • Currently Reading</div></div>`;
}).catch(()=>{});
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script>
</body>
</html>
