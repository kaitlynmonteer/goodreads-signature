<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Currently Reading</title>
<style>
  body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#222}
  .reading{display:flex;align-items:center;gap:10px;width:max-content;max-width:360px;padding:6px 8px}
  .cover{width:42px;height:62px;object-fit:cover;border-radius:2px;box-shadow:0 1px 4px #999}
  .label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
  .title{font-size:14px;line-height:1.25;font-weight:600}
  .author{font-size:12px;color:#666;margin-top:2px}
  a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<div id="app" class="reading"><span style="font-size:12px;color:#777">Currently reading…</span></div>
<script>
fetch('current-reading.json?t='+Date.now()).then(r=>r.json()).then(b=>{
  const app=document.getElementById('app');
  if(!b.title){app.innerHTML='<span style="font-size:12px;color:#777">Not currently reading</span>';return;}
  app.innerHTML=`<img class="cover" src="${b.cover}" alt="Book cover"><div><div class="label">Currently reading</div><div class="title"><a href="${b.url}">${escapeHtml(b.title)}</a></div><div class="author">by ${escapeHtml(b.author)}</div></div>`;
}).catch(()=>{});
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
</script>
</body>
</html>
