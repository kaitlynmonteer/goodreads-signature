name: Update Goodreads Currently Reading

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-goodreads
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image library
        run: python -m pip install Pillow
      - name: Fetch Goodreads shelf and update data
        run: python update.py
      - name: Generate email signature PNG
        run: python generate_signature.py
      - name: Commit updated data and image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-reading.json currently-reading.png
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Update Goodreads email signature'
          git pull --rebase origin main
          git push origin HEAD:main
